steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "backend"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy irms-api \
          --image=${_IMAGE} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --set-env-vars=DJANGO_SETTINGS_MODULE=irms.settings.prod,FIREBASE_PROJECT_ID=${_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_PROJECT_ID}.appspot.com \
          --memory=512Mi --cpu=1 --max-instances=10
  - name: gcr.io/cloud-builders/npm
    dir: frontend
    args: ["install"]
  - name: gcr.io/cloud-builders/npm
    dir: frontend
    args: ["run", "build"]
  - name: gcr.io/${PROJECT_ID}/firebase
    args: ["deploy", "--only", "hosting,firestore"]

substitutions:
  _REGION: africa-south1
  _PROJECT_ID: rpa-irms-dev
  _IMAGE: gcr.io/${PROJECT_ID}/irms-api:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
